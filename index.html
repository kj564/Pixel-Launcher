<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Liberty City — Web Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;overscroll-behavior:none;position:fixed;touch-action:none}
#c{width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none;z-index:10}
#minimap{top:env(safe-area-inset-top,10px);left:10px;width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,0.3);background:rgba(0,0,0,0.5);overflow:hidden}
#stars{top:env(safe-area-inset-top,10px);right:10px;display:flex;gap:2px}
.star{font-size:22px;color:#333;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.8))}
.star.on{color:#fbbf24}
#speedo{bottom:env(safe-area-inset-bottom,90px);left:50%;transform:translateX(-50%);display:none;text-align:center}
#speedo .num{font-size:36px;font-weight:700;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,0.8);font-family:system-ui}
#speedo .lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:2px}
#health{bottom:env(safe-area-inset-bottom,20px);left:50%;transform:translateX(-50%);width:200px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;overflow:hidden}
#healthBar{height:100%;background:#22c55e;border-radius:3px;transition:width 0.3s,width 0.3s}
#joystick{position:absolute;bottom:env(safe-area-inset-bottom,30px);left:30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.15);z-index:20;touch-action:none}
#knob{position:absolute;top:50%;left:50%;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.25);transform:translate(-50%,-50%);transition:transform 0.05s}
#actions{position:absolute;bottom:env(safe-area-inset-bottom,30px);right:30px;display:flex;flex-direction:column;gap:10px;z-index:20}
.act-btn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;font-family:system-ui}
.act-btn:active{background:rgba(255,255,255,0.25);transform:scale(0.92)}
#btnEnter{background:rgba(34,197,94,0.2);border-color:rgba(34,197,94,0.4)}
#btnFire{background:rgba(239,68,68,0.2);border-color:rgba(239,68,68,0.4)}
#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:16px;font-weight:600;text-align:center;text-shadow:0 2px 8px rgba(0,0,0,1);z-index:30;opacity:0;transition:opacity 0.5s;pointer-events:none;font-family:system-ui;max-width:80%}
#msg.show{opacity:1}
#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#666;font-size:14px;font-family:system-ui}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Loading Liberty City…</div>
<div class="hud" id="minimap"><canvas id="mmCanvas" width="140" height="140"></canvas></div>
<div class="hud" id="stars"><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
<div class="hud" id="speedo"><div class="num" id="spdNum">0</div><div class="lbl">MPH</div></div>
<div class="hud" id="health"><div id="healthBar" style="width:100%"></div></div>
<div id="joystick"><div id="knob"></div></div>
<div id="actions">
<div class="act-btn" id="btnFire" style="display:none">FIRE</div>
<div class="act-btn" id="btnEnter">STEAL<br>CAR</div>
</div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Three.js loaded from CDN script tag above

// ═══════════════════════════════════════════════════════════════
// Liberty City Web Edition — GTA SA-inspired 3D game for iPhone 13
// Optimized: capped DPR, fog culling, low-poly, minimal lights
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap at 2 for iPhone 13 perf
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false; // No shadows for mobile perf

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 60, 200); // Fog culls distant objects

const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 500);

// ── Lights ──
const ambient = new THREE.AmbientLight(0x9090aa, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff0dd, 0.8);
sun.position.set(50, 80, 30);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x4488ff, 0x444422, 0.3);
scene.add(hemi);

// ── Ground ──
const groundGeo = new THREE.PlaneGeometry(500, 500);
const groundMat = new THREE.MeshLambertMaterial({ color: 0x2a2a3e });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ── Road grid ──
const ROAD_W = 14, BLOCK = 40, GRID = 7;
const cityMin = -(GRID * BLOCK) / 2;
const cityMax = (GRID * BLOCK) / 2;

const roadMat = new THREE.MeshLambertMaterial({ color: 0x333338 });
const lineMat = new THREE.MeshBasicMaterial({ color: 0x888888 });
const sidewalkMat = new THREE.MeshLambertMaterial({ color: 0x4a4a55 });

for (let i = 0; i <= GRID; i++) {
  const pos = cityMin + i * BLOCK;
  // Horizontal road
  const rh = new THREE.Mesh(new THREE.PlaneGeometry(cityMax - cityMin, ROAD_W), roadMat);
  rh.rotation.x = -Math.PI / 2; rh.position.set(0, 0.02, pos); scene.add(rh);
  // Vertical road
  const rv = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, cityMax - cityMin), roadMat);
  rv.rotation.x = -Math.PI / 2; rv.position.set(pos, 0.02, 0); scene.add(rv);
  // Lane lines
  for (let j = 0; j < GRID; j++) {
    const lx = cityMin + (j + 0.5) * BLOCK;
    const lh = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.3), lineMat);
    lh.rotation.x = -Math.PI / 2; lh.position.set(lx, 0.03, pos); scene.add(lh);
    const lv = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 4), lineMat);
    lv.rotation.x = -Math.PI / 2; lv.position.set(pos, 0.03, lx); scene.add(lv);
  }
}

// ── Buildings ──
const buildingColors = [0x5a4a3a, 0x4a5a6a, 0x6a5a4a, 0x4a4a5a, 0x5a5a4a, 0x3a4a5a, 0x6a4a4a, 0x4a6a5a];
const buildings = [];
for (let bx = 0; bx < GRID; bx++) {
  for (let bz = 0; bz < GRID; bz++) {
    const cx = cityMin + bx * BLOCK + BLOCK / 2;
    const cz = cityMin + bz * BLOCK + BLOCK / 2;
    // Sidewalk
    const sw = new THREE.Mesh(new THREE.BoxGeometry(BLOCK - ROAD_W, 0.2, BLOCK - ROAD_W), sidewalkMat);
    sw.position.set(cx, 0.1, cz); scene.add(sw);
    // Buildings in block (2-4 per block)
    const n = 2 + Math.floor(Math.random() * 3);
    for (let b = 0; b < n; b++) {
      const w = 8 + Math.random() * 10, d = 8 + Math.random() * 10, h = 10 + Math.random() * 35;
      const ox = (Math.random() - 0.5) * (BLOCK - ROAD_W - w - 2);
      const oz = (Math.random() - 0.5) * (BLOCK - ROAD_W - d - 2);
      const mat = new THREE.MeshLambertMaterial({ color: buildingColors[Math.floor(Math.random() * buildingColors.length)] });
      const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
      bldg.position.set(cx + ox, h / 2 + 0.2, cz + oz);
      scene.add(bldg);
      buildings.push({ mesh: bldg, w, d, h, x: bldg.position.x, z: bldg.position.z });
      // Roof detail
      const roof = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, 2, d * 0.6), new THREE.MeshLambertMaterial({ color: 0x333333 }));
      roof.position.set(bldg.position.x, h + 1.2, bldg.position.z);
      scene.add(roof);
    }
  }
}

// ── Streetlights (limited for perf) ──
for (let i = 0; i < GRID; i++) {
  for (let j = 0; j <= GRID; j++) {
    if (Math.random() > 0.5) continue;
    const x = cityMin + i * BLOCK + BLOCK / 2;
    const z = cityMin + j * BLOCK;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8), new THREE.MeshLambertMaterial({ color: 0x222222 }));
    pole.position.set(x + ROAD_W/2 + 1, 4, z); scene.add(pole);
  }
}

// ── Player (on foot) ──
const playerGroup = new THREE.Group();
const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2a4a6a });
const playerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2, 8), bodyMat);
playerBody.position.y = 1; playerGroup.add(playerBody);
// Head
const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 8, 8), new THREE.MeshLambertMaterial({ color: 0xd4a76a }));
head.position.y = 2; playerGroup.add(head);
// Facing direction indicator
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.4), new THREE.MeshLambertMaterial({ color: 0xd4a76a }));
nose.position.set(0, 1.8, 0.4); playerGroup.add(nose);
playerGroup.position.set(0, 0, 0);
scene.add(playerGroup);

const player = {
  pos: new THREE.Vector3(0, 0, 0),
  rot: 0,
  speed: 0,
  walkSpeed: 8,
  health: 100,
  inCar: null,
  wanted: 0,
};

// ── Cars ──
const carColors = [0xcc2222, 0x2222cc, 0x22cc22, 0xcccc22, 0xcc6622, 0x666666, 0xdddddd, 0x222222];
const cars = [];
function createCar(x, z, color) {
  const group = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4.2), mat); body.position.y = 0.6; group.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 2.2), new THREE.MeshLambertMaterial({ color: 0x111122 }));
  cabin.position.set(0, 1.3, -0.3); group.add(cabin);
  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8);
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
  [[-1, -1.3], [1, -1.3], [-1, 1.3], [1, 1.3]].forEach(([wx, wz]) => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2; w.position.set(wx, 0.4, wz); group.add(w);
  });
  // Headlights
  const hlMat = new THREE.MeshBasicMaterial({ color: 0xffff88 });
  [[-0.7, 2.1], [0.7, 2.1]].forEach(([hx, hz]) => {
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 4), hlMat);
    hl.position.set(hx, 0.7, hz); group.add(hl);
  });
  group.position.set(x, 0, z);
  scene.add(group);
  return {
    group, x, z, rot: Math.random() * Math.PI * 2, speed: 0,
    maxSpeed: 35, accel: 20, brakeForce: 30, turnRate: 1.8,
    color, occupied: false,
  };
}

// Spawn cars on roads
for (let i = 0; i < 25; i++) {
  const gi = Math.floor(Math.random() * (GRID + 1));
  const pos = cityMin + gi * BLOCK;
  const along = cityMin + Math.random() * (cityMax - cityMin);
  if (Math.random() > 0.5) cars.push(createCar(pos, along, carColors[Math.floor(Math.random() * carColors.length)]));
  else cars.push(createCar(along, pos, carColors[Math.floor(Math.random() * carColors.length)]));
}

// ── Police cars ──
const policeCars = [];
function spawnPolice(nearX, nearZ) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 40 + Math.random() * 20;
  const px = nearX + Math.cos(angle) * dist;
  const pz = nearZ + Math.sin(angle) * dist;
  const p = createCar(px, pz, 0x2244aa);
  p.isPolice = true;
  // Light bar
  const lb = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.2, 0.4), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
  lb.position.set(0, 1.7, -0.3); p.group.add(lb);
  p.lightBar = lb;
  policeCars.push(p);
  return p;
}

// ── Touch Controls ──
const joy = { active: false, dx: 0, dz: 0, startX: 0, startY: 0, id: null };
const joystick = document.getElementById('joystick');
const knob = document.getElementById('knob');

joystick.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joy.active = true; joy.id = t.identifier;
  joy.startX = t.clientX; joy.startY = t.clientY;
}, { passive: false });

joystick.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joy.id) continue;
    const dx = t.clientX - joy.startX;
    const dy = t.clientY - joy.startY;
    const len = Math.hypot(dx, dy);
    const max = 50;
    const cl = Math.min(len, max);
    const nx = len > 0 ? (dx / len) * cl : 0;
    const ny = len > 0 ? (dy / len) * cl : 0;
    knob.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
    joy.dx = nx / max; joy.dz = ny / max;
  }
}, { passive: false });

joystick.addEventListener('touchend', (e) => {
  e.preventDefault();
  joy.active = false; joy.dx = 0; joy.dz = 0; joy.id = null;
  knob.style.transform = 'translate(-50%, -50%)';
}, { passive: false });

// Action buttons
const btnEnter = document.getElementById('btnEnter');
const btnFire = document.getElementById('btnFire');
const speedoEl = document.getElementById('speedo');
const spdNum = document.getElementById('spdNum');

btnEnter.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (player.inCar) {
    // Exit car
    player.pos.copy(player.inCar.group.position);
    player.pos.x += 3; player.pos.y = 0;
    player.rot = player.inCar.rot;
    player.inCar.occupied = false;
    player.inCar = null;
    btnEnter.innerHTML = 'STEAL<br>CAR';
    btnFire.style.display = 'none';
    speedoEl.style.display = 'none';
    showMsg('On foot');
  } else {
    // Find nearest car
    let nearest = null, nd = 6;
    for (const c of cars) {
      if (c.occupied) continue;
      const d = Math.hypot(c.x - player.pos.x, c.z - player.pos.z);
      if (d < nd) { nd = d; nearest = c; }
    }
    if (nearest) {
      player.inCar = nearest;
      nearest.occupied = true;
      btnEnter.innerHTML = 'EXIT<br>CAR';
      btnFire.style.display = 'flex';
      speedoEl.style.display = 'block';
      showMsg(nearest.isPolice ? 'Police car stolen!' : 'Car stolen!');
      // Gain wanted for stealing
      if (!nearest.isPolice && player.wanted < 1) player.wanted = 1;
      updateStars();
    }
  }
}, { passive: false });

btnFire.addEventListener('touchstart', (e) => {
  e.preventDefault();
  // Simple: increase wanted when firing
  if (player.wanted < 5) { player.wanted++; updateStars(); showMsg('Wanted level up!'); }
  if (policeCars.length < player.wanted * 2 && player.wanted > 0) spawnPolice(player.pos.x, player.pos.z);
}, { passive: false });

function updateStars() {
  const els = document.querySelectorAll('.star');
  els.forEach((el, i) => el.classList.toggle('on', i < player.wanted));
}

function showMsg(text) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── Camera ──
let camAngle = 0;
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();

function updateCamera() {
  const target = player.inCar ? player.inCar.group.position : player.pos;
  camTarget.lerp(target, 0.15);
  
  if (player.inCar) {
    // Car camera — behind and above
    const rot = player.inCar.rot;
    const dist = 9;
    camPos.set(
      camTarget.x - Math.sin(rot) * dist,
      camTarget.y + 5,
      camTarget.z - Math.cos(rot) * dist
    );
  } else {
    // On-foot camera
    camPos.set(
      camTarget.x - Math.sin(camAngle) * 8,
      camTarget.y + 4,
      camTarget.z - Math.cos(camAngle) * 8
    );
  }
  camera.position.lerp(camPos, 0.12);
  camera.lookAt(camTarget.x, camTarget.y + 1, camTarget.z);
}

// ── Collision helpers ──
function checkBuildingCollision(x, z, r) {
  for (const b of buildings) {
    const dx = Math.abs(x - b.x);
    const dz = Math.abs(z - b.z);
    if (dx < b.w / 2 + r && dz < b.d / 2 + r) return true;
  }
  return false;
}

function clampToCity(x, z) {
  return {
    x: Math.max(cityMin + ROAD_W/2, Math.min(cityMax - ROAD_W/2, x)),
    z: Math.max(cityMin + ROAD_W/2, Math.min(cityMax - ROAD_W/2, z)),
  };
}

// ── Minimap ──
const mmCanvas = document.getElementById('mmCanvas');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap() {
  const w = 140, h = 140, scale = 0.35;
  const cx = player.inCar ? player.inCar.group.position.x : player.pos.x;
  const cz = player.inCar ? player.inCar.group.position.z : player.pos.z;
  mmCtx.fillStyle = '#1a1a2e'; mmCtx.fillRect(0, 0, w, h);
  // Roads
  mmCtx.strokeStyle = '#444'; mmCtx.lineWidth = 3;
  for (let i = 0; i <= GRID; i++) {
    const p = (cityMin + i * BLOCK - cx) * scale + w / 2;
    mmCtx.beginPath(); mmCtx.moveTo(0, p); mmCtx.lineTo(w, p); mmCtx.stroke();
    mmCtx.beginPath(); mmCtx.moveTo(p, 0); mmCtx.lineTo(p, h); mmCtx.stroke();
  }
  // Buildings
  mmCtx.fillStyle = '#3a3a4e';
  for (const b of buildings) {
    const bx = (b.x - cx) * scale + w / 2;
    const bz = (b.z - cz) * scale + h / 2;
    if (bx < 0 || bx > w || bz < 0 || bz > h) continue;
    mmCtx.fillRect(bx - 2, bz - 2, 4, 4);
  }
  // Cars
  mmCtx.fillStyle = '#888';
  for (const c of cars) {
    const cx2 = (c.x - cx) * scale + w / 2;
    const cz2 = (c.z - cz) * scale + h / 2;
    if (cx2 < 0 || cx2 > w || cz2 < 0 || cz2 > h) continue;
    mmCtx.fillRect(cx2 - 1, cz2 - 1, 3, 3);
  }
  // Police
  mmCtx.fillStyle = '#44f';
  for (const p of policeCars) {
    const px = (p.x - cx) * scale + w / 2;
    const pz = (p.z - cz) * scale + h / 2;
    if (px < 0 || px > w || pz < 0 || pz > h) continue;
    mmCtx.fillRect(px - 2, pz - 2, 4, 4);
  }
  // Player
  mmCtx.fillStyle = '#2f2';
  mmCtx.beginPath(); mmCtx.arc(w / 2, h / 2, 3, 0, Math.PI * 2); mmCtx.fill();
}

// ── Game Loop ──
let lastTime = performance.now();
let policeTimer = 0;

function update(dt) {
  if (player.inCar) {
    // ── Driving ──
    const car = player.inCar;
    // Accelerate with joystick up
    const throttle = -joy.dz; // up = forward
    const steer = joy.dx;
    
    if (throttle > 0.1) car.speed += car.accel * throttle * dt;
    else if (throttle < -0.1) car.speed += car.brakeForce * throttle * dt;
    else car.speed *= (1 - 2 * dt); // friction
    
    car.speed = Math.max(-car.maxSpeed * 0.4, Math.min(car.maxSpeed, car.speed));
    
    // Steering proportional to speed
    const speedFactor = Math.min(Math.abs(car.speed) / 10, 1);
    car.rot += steer * car.turnRate * speedFactor * dt;
    
    const nx = car.x + Math.sin(car.rot) * car.speed * dt;
    const nz = car.z + Math.cos(car.rot) * car.speed * dt;
    
    // Collision with buildings
    if (!checkBuildingCollision(nx, nz, 2)) {
      const clamped = clampToCity(nx, nz);
      car.x = clamped.x; car.z = clamped.z;
      car.group.position.set(car.x, 0, car.z);
    } else {
      car.speed *= 0.3; // crash slow
    }
    car.group.rotation.y = car.rot;
    
    // Update player pos to car
    player.pos.set(car.x, 0, car.z);
    player.rot = car.rot;
    
    // Speedometer
    spdNum.textContent = Math.abs(Math.round(car.speed * 2.24)); // m/s to mph approx
    
    // Police chase
    policeTimer += dt;
    if (policeTimer > 0.5) {
      policeTimer = 0;
      if (player.wanted > 0 && policeCars.length < player.wanted * 2) {
        spawnPolice(player.pos.x, player.pos.z);
      }
    }
    
    // Police AI
    for (let i = policeCars.length - 1; i >= 0; i--) {
      const pc = policeCars[i];
      const dx = player.pos.x - pc.x;
      const dz = player.pos.z - pc.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 100) {
        const targetRot = Math.atan2(dx, dz);
        let rotDiff = targetRot - pc.rot;
        while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
        while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
        pc.rot += rotDiff * 2 * dt;
        pc.speed = Math.min(pc.maxSpeed * 0.8, dist * 0.5);
        const pnx = pc.x + Math.sin(pc.rot) * pc.speed * dt;
        const pnz = pc.z + Math.cos(pc.rot) * pc.speed * dt;
        if (!checkBuildingCollision(pnx, pnz, 2)) {
          const c = clampToCity(pnx, pnz);
          pc.x = c.x; pc.z = c.z; pc.group.position.set(pc.x, 0, pc.z);
        }
        pc.group.rotation.y = pc.rot;
        // Flashing lights
        if (pc.lightBar) {
          pc.lightBar.material.color.setHex(Math.floor(performance.now() / 300) % 2 ? 0xff0000 : 0x0000ff);
        }
      }
      // Despawn if too far
      if (dist > 150) {
        scene.remove(pc.group);
        policeCars.splice(i, 1);
      }
    }
  } else {
    // ── On foot ──
    const moveX = joy.dx;
    const moveZ = joy.dz;
    const len = Math.hypot(moveX, moveZ);
    if (len > 0.05) {
      const angle = Math.atan2(moveX, moveZ);
      player.rot = angle;
      const sp = player.walkSpeed * Math.min(len, 1);
      const nx = player.pos.x + Math.sin(angle) * sp * dt;
      const nz = player.pos.z + Math.cos(angle) * sp * dt;
      if (!checkBuildingCollision(nx, nz, 0.6)) {
        const c = clampToCity(nx, nz);
        player.pos.x = c.x; player.pos.z = c.z;
      }
    }
    
    // Camera angle follows movement direction
    if (len > 0.05) {
      camAngle += (Math.atan2(moveX, moveZ) - camAngle) * 2 * dt;
    }
  }
  
  // Update player group
  playerGroup.position.set(player.pos.x, 0, player.pos.z);
  playerGroup.rotation.y = player.rot;
  
  // Health regen slowly
  if (player.health < 100) player.health = Math.min(100, player.health + 2 * dt);
  document.getElementById('healthBar').style.width = player.health + '%';
  
  updateCamera();
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  update(dt);
  drawMinimap();
  renderer.render(scene, camera);
}

// ── Resize ──
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ── Prevent iOS gestures ──
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });

// ── Start ──
document.getElementById('loading').style.display = 'none';
showMsg('Welcome to Liberty City! Steal a car to start.');
animate();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
